version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: S@4508PShib#
      POSTGRES_DB: market_data_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  processing:
    build:
      context: .
      dockerfile: processing_service/Dockerfile
    ports:
      - "8001:8001"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=S@4508PShib#
      - DB_NAME=market_data_db

  ingestion:
    build:
      context: .
      dockerfile: ingestion_service/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - processing

volumes:
  postgres_data: